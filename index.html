<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Normalibs® · Probiótico líder para el Síndrome de Intestino Irritable. Sitio web, Instagram y Facebook.">
<meta property="og:title" content="Normalibs®">
<meta property="og:description" content="Probiótico líder para el Síndrome de Intestino Irritable · Centroamérica">

<title>Normalibs Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Layout: link-in-bio card, same system as the "Apunta a ti" quiz — offwhite or deep navy ground, rotating petri avatar with white logo, teal pills. */
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#1D1D1B; --head:#0A3A47; --muted:#5B6E73; --line:#E6E3DD;
  --accent:#0B7880; --accent-ink:#0A7A83; --aqua:#7EC3CF; --soft:#E4F1F2; --glass:rgba(255,255,255,.72);
  --font:"Montserrat",Arial,"Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06191F; --card:#0C2A33; --ink:#E9F1F1; --head:#F4F8F8; --muted:#9DB6BB; --line:#1C4350;
  --accent-ink:#5CC8D0; --soft:#0F3A45; --glass:rgba(12,42,51,.72); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06191F; --card:#0C2A33; --ink:#E9F1F1; --head:#F4F8F8; --muted:#9DB6BB; --line:#1C4350;
  --accent-ink:#5CC8D0; --soft:#0F3A45; --glass:rgba(12,42,51,.72); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s;overflow-x:hidden}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px;border-radius:14px}
sup{font-size:.6em;line-height:0}

/* ambient culture blobs */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;width:420px;height:420px;border-radius:50%;background:url(assets/petri.webp) center/cover;filter:blur(70px);opacity:.28}
.amb i:nth-child(1){top:-160px;left:-160px}
.amb i:nth-child(2){bottom:-180px;right:-170px;opacity:.22}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:28px 32px;min-height:100vh;display:flex;flex-direction:column}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:18px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:20px;animation:up .7s var(--ease) both}
.bar{align-self:stretch;display:flex;justify-content:flex-end;gap:8px}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--head);cursor:pointer;transition:transform .2s var(--ease),background .2s}
.iconbtn:hover{transform:translateY(-2px)}
.theme .sun{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--head);color:var(--bg);font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:99px;transition:all .3s var(--ease);z-index:5;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.avatar{position:relative;width:132px;height:132px;margin-top:2px;animation:pop .9s var(--spring) both .1s}
.avatar img.dish{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:spin 80s linear infinite;filter:drop-shadow(0 14px 22px rgba(10,58,71,.3))}
.avatar::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--aqua);animation:ripple 4s ease-out 3 1s}
.avatar .scrim{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,58,71,.6),rgba(10,58,71,.25) 60%,rgba(10,58,71,0))}
.avatar .lg{position:absolute;left:12%;right:12%;top:50%;transform:translateY(-50%);width:76%;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
h1{margin:0;font-size:24px;font-weight:800;color:var(--head);letter-spacing:-.01em;display:flex;align-items:center;gap:6px;text-align:center}
h1 svg{flex:none;color:#3897F0}
.bio{margin:-10px 0 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.55;max-width:34ch;text-wrap:balance}
.bio b{color:var(--head);font-weight:600}
.bio a{color:var(--accent-ink);font-weight:600;text-decoration:none}
.bio a:hover{text-decoration:underline}
.socials{display:flex;gap:6px}
.socials a{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:var(--head);transition:transform .25s var(--ease),background .2s}
.socials a:hover{transform:translateY(-3px);background:var(--soft)}
.socials .soc-soon{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:var(--head);opacity:.4;cursor:default}
.links{align-self:stretch;display:flex;flex-direction:column;gap:12px;list-style:none;margin:4px 0 0;padding:0}
.links li{animation:pop .55s var(--ease) both;animation-delay:calc(var(--i)*80ms + .35s)}
.lk{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:68px;padding:8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--head);text-decoration:none;font-weight:700;font-size:15.5px;text-align:center;transition:transform .2s var(--ease),border-color .2s,color .25s,box-shadow .25s}
.lk::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .38s var(--ease);z-index:-1}
.lk:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 16px 28px -20px rgba(10,58,71,.6)}
.lk:hover::before,.lk:focus-visible::before{transform:scaleX(1)}
.lk:hover,.lk:focus-visible{color:#fff}
.lk:active{transform:scale(.985)}
.lk .th{width:52px;height:52px;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--soft);color:var(--accent-ink);transition:background .25s,color .25s}
.lk:hover .th,.lk:focus-visible .th{background:rgba(255,255,255,.18);color:#fff}
.lk .th svg{position:relative}
.lk .tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.lk small{font-size:12px;font-weight:500;opacity:.75}
.lk .go{justify-self:center;opacity:.55;transition:transform .25s var(--ease),opacity .2s}
.lk:hover .go{transform:translateX(3px);opacity:1}
.lk.soon{cursor:default;border-style:dashed;background:transparent;color:var(--muted);grid-template-columns:52px 1fr auto;padding-right:14px}
.lk.soon::before{display:none}
.lk.soon:hover{transform:none;box-shadow:none;border-color:var(--line);color:var(--muted)}
.lk.soon:hover .th{background:var(--soft);color:var(--accent-ink)}
.lk.soon .tx{color:var(--head)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--soft);border-radius:99px;padding:6px 10px;white-space:nowrap}
.foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:up .7s var(--ease) both .8s}
.logos{display:flex;align-items:center;justify-content:center;gap:22px}
.logos img{width:110px;height:auto;max-width:40%;filter:brightness(0) saturate(100%);opacity:.65}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logos img{filter:none;opacity:.8}}
:root[data-theme="dark"] .logos img{filter:none;opacity:.8}
.legal{margin:0;font-size:11.5px;color:var(--muted);text-align:center;max-width:44ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@keyframes up{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{from{transform:scale(.92);opacity:.8}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const root=document.documentElement;root.lang="es";
  try{const t=localStorage.getItem("nl-theme");if(t==="dark"||t==="light")root.dataset.theme=t}catch(e){}
  document.getElementById("theme").addEventListener("click",()=>{
    const cur=root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark";root.dataset.theme=nx;try{localStorage.setItem("nl-theme",nx)}catch(e){}
  });
  const toast=document.getElementById("toast");
  const show=m=>{toast.textContent=m;toast.classList.add("on");clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove("on"),2200)};
  document.getElementById("share").addEventListener("click",async()=>{
    const url=location.href.split("#")[0];
    try{if(navigator.share){await navigator.share({title:"Normalibs®",url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(url);show("Enlace copiado")}catch(e){show(url)}
  });
})();
</script>
